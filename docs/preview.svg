<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="170" y1="40" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171B2D"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="984" cy="36" r="260" fill="#5B6DFF" fill-opacity="0.09"/>
  <circle cx="158" cy="594" r="220" fill="#7F56D9" fill-opacity="0.07"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="90" y="116" fill="#909CFF" font-size="20" font-weight="700" letter-spacing="2">LOCAL WHISPER · BROWSER-ONLY</text>
    <text x="90" y="184" fill="#F5F7FA" font-size="52" font-weight="700" letter-spacing="-2">Speech-to-text for web apps.</text>
    <text x="90" y="226" fill="#A9B1BD" font-size="24">Private dictation. No backend. No API key. No audio upload.</text>

    <g filter="url(#shadow)">
      <rect x="90" y="282" width="1020" height="208" rx="22" fill="#12151B" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="122" y="324" fill="#909CFF" font-size="13" font-weight="700" letter-spacing="1.4">LIVE DEMO</text>

      <rect x="122" y="344" width="956" height="114" rx="18" fill="#27272A" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="146" y="383" fill="#F5F7FA" font-size="20">Créer un nouveau client et préparer la facture de septembre</text>

      <rect x="146" y="411" width="70" height="27" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="160" y="429" fill="#C2C6CD" font-size="12">French</text>
      <rect x="224" y="411" width="58" height="27" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="239" y="429" fill="#C2C6CD" font-size="12">Base</text>

      <rect x="889" y="410" width="161" height="29" rx="14.5" fill="#323236"/>
      <g fill="#F5F5F5">
        <rect x="908" y="418" width="2" height="13" rx="1"/>
        <rect x="914" y="415" width="2" height="19" rx="1"/>
        <rect x="920" y="420" width="2" height="9" rx="1"/>
        <rect x="926" y="416" width="2" height="17" rx="1"/>
        <rect x="932" y="419" width="2" height="11" rx="1"/>
      </g>
      <text x="947" y="429" fill="#F5F5F5" font-size="11">0:07</text>
      <rect x="1028" y="420" width="9" height="9" rx="2" fill="#F5F5F5"/>

      <circle cx="137" cy="474" r="5" fill="#58C98B"/>
      <text x="151" y="480" fill="#8E98A6" font-size="15">Tap to latch · hold to talk · slide left to cancel</text>
    </g>

    <g>
      <rect x="90" y="530" width="172" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="124" y="557" fill="#B8C0CB" font-size="15">✓ No backend</text>

      <rect x="278" y="530" width="166" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="310" y="557" fill="#B8C0CB" font-size="15">✓ No API key</text>

      <rect x="460" y="530" width="190" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="492" y="557" fill="#B8C0CB" font-size="15">✓ Audio stays local</text>

      <text x="952" y="557" fill="#6F7987" font-size="15">@matteogiaquinto</text>
    </g>
  </g>
</svg>
