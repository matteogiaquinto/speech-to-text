name: Temporary format validation branch

on:
  push:
    branches:
      - cache-preload-v020

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write examples/browser/docs/index.html src/speech-to-text.ts src/types.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/browser/docs/index.html src/speech-to-text.ts src/types.ts
          git commit -m "style: format preload changes"
          git push origin HEAD:cache-preload-v020
